<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#0b0c0a"><title>404 · Página no encontrada</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>:root{--bg:#0b0c0a;--card:#141612;--line:#262a22;--ink:#ecebe4;--mut:#8b8f82;--acc:#c8ff3d;--r:22px}
@media(prefers-color-scheme:light){:root{--bg:#f4f3ec;--card:#fff;--line:#dedcd0;--ink:#15160f;--mut:#6b6e60;--acc:#4c8a00}}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.6 ui-sans-serif,system-ui,"Segoe UI",sans-serif;padding-bottom:90px;overflow-x:hidden}
a{color:inherit;text-decoration:none}main{max-width:1040px;margin:auto;padding:0 20px}
.mono{font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:99px;z-index:9;max-width:96vw;overflow-x:auto}
.nav a{padding:8px 14px;border-radius:99px;font-size:13px;color:var(--mut);transition:.25s;white-space:nowrap}
.nav a:hover,.nav a.on{background:var(--acc);color:#0b0c0a}
.hero{min-height:92vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
.hero h1{font-size:clamp(44px,12vw,120px);line-height:.95;letter-spacing:-.04em;animation:blur 1.2s both}
.hero h1 em{font-style:normal;color:var(--acc)}
@keyframes blur{from{filter:blur(18px);opacity:0;transform:translateY(20px)}}
.roles{display:flex;gap:8px;flex-wrap:wrap}.roles span,.tag{border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12px;color:var(--mut)}
.marquee{overflow:hidden;border-block:1px solid var(--line);padding:12px 0;margin:10px 0 60px}
.marquee div{display:flex;gap:40px;width:max-content;animation:mq 25s linear infinite;font-size:22px;font-weight:700;color:var(--mut)}
@keyframes mq{to{transform:translateX(-50%)}}
section{padding:70px 0}h2{font-size:clamp(30px,6vw,56px);letter-spacing:-.03em;line-height:1.05;margin:8px 0 28px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;overflow:hidden;transition:.3s;display:block}
.card:hover{transform:translateY(-4px);border-color:var(--acc)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--x,50%) var(--y,0),color-mix(in srgb,var(--acc) 16%,transparent),transparent);opacity:0;transition:.3s}
.card:hover::before{opacity:1}.card>*{position:relative}.card h3{margin:6px 0}.card p{color:var(--mut);font-size:15px}
.wide{grid-column:1/-1}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.rv{opacity:0;transform:translateY(28px);transition:.8s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mut);margin-right:8px}.dot.online{background:#3ddc84}.dot.idle{background:#ffb020}.dot.dnd{background:#ff5d5d}
form{display:grid;gap:12px}textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit}
button,.btn{background:var(--acc);color:#0b0c0a;border:0;border-radius:99px;padding:12px 22px;font-weight:700;cursor:pointer;display:inline-block}
footer{padding:40px 0;color:var(--mut);font-size:13px;border-top:1px solid var(--line)}
.center{min-height:90vh;display:grid;place-content:center;text-align:center;gap:14px}.big{font-size:clamp(90px,28vw,260px);font-weight:800;letter-spacing:-.06em;line-height:.9;color:var(--acc)}
.stat{font-size:42px;font-weight:800;letter-spacing:-.03em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}
.skip{position:absolute;left:-999px;top:8px;background:var(--acc);color:#0b0c0a;padding:8px 14px;border-radius:99px;z-index:20}.skip:focus{left:12px}
.prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--acc);z-index:20}
.pf{display:flex;align-items:center;gap:14px}.pf img{width:64px;height:64px;border-radius:50%;border:2px solid var(--line)}
.hz{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.hz span{color:var(--mut)}.hz span+span::before{content:"·";margin-right:10px;color:var(--acc)}
input{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit}
.hp{position:absolute;left:-9999px;opacity:0}.cnt{font-size:12px;color:var(--mut);text-align:right}
.fl{display:flex;gap:18px;flex-wrap:wrap}.fl a:hover{color:var(--acc)}
.prose{max-width:720px;padding-top:90px}.prose h3{margin:26px 0 6px}.prose p,.prose li{color:var(--mut)}.prose ul{padding-left:20px}
.up{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.up span{color:var(--mut);font-size:13px}
@media(max-width:520px){.nav{gap:0;padding:5px}.nav a{padding:8px 10px;font-size:12px}.nav .hm{display:none}}
</style></head><body><main class="center"><div class="big">404</div><h2 style="margin:0">Esta página no existe.</h2><p style="color:var(--mut)">El enlace puede estar roto o la página se movió.</p><div class="row" style="justify-content:center"><a class="btn" href="/">Volver al inicio</a><a class="btn" href="/#projects" style="background:transparent;color:var(--ink);border:1px solid var(--line)">Ver proyectos</a></div></main></body></html>
